name: Subscription Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # هر ۵ دقیقه یک‌بار اجرا می‌شود
  workflow_dispatch: {}       # امکان اجرای دستی از تب Actions

permissions:
  contents: write

concurrency:
  group: subscription-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PRIVATE_CHANNEL_ID: ${{ secrets.PRIVATE_CHANNEL_ID }}
          PUBLIC_CHANNEL_LINK: ${{ secrets.PUBLIC_CHANNEL_LINK }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          WALLET_ADDRESS_TRC20: ${{ secrets.WALLET_ADDRESS_TRC20 }}
          WALLET_ADDRESS_BEP20: ${{ secrets.WALLET_ADDRESS_BEP20 }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          PAYMENT_WINDOW_MINUTES: ${{ secrets.PAYMENT_WINDOW_MINUTES }}
        run: python subscription_bot.py

      - name: Commit updated data
        run: |
          git config user.name "subscription-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "no changes"
          else
            git commit -m "update subscription data [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
